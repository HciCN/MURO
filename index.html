<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>游戏仓库 · Game Vault</title>
<meta name="description" content="一个以 3D 流体画廊陈列的游戏资源收藏站">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎮</text></svg>">
<link rel="stylesheet" href="css/style.css">
<!-- GSAP：仅用于 DOM 文字动画（加载失败时自动降级为 CSS 动画） -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
</head>
<body>

<!-- ═══ 预加载器 ═══ -->
<div id="loader">
  <div class="loader-panel loader-top"></div>
  <div class="loader-panel loader-bottom"></div>
  <div class="loader-center">
    <div id="loader-brand"></div>
    <div class="loader-row">
      <span id="loader-pct">00</span>
      <div class="loader-line"><div id="loader-fill"></div></div>
    </div>
  </div>
</div>

<!-- ═══ 顶栏 ═══ -->
<header id="topbar">
  <div class="top-left">
    <span id="brand"></span>
    <div id="theme-toggle">
      <span class="tt-item tt-mono">黑白</span>
      <span class="tt-sep">/</span>
      <span class="tt-item tt-color">幻彩</span>
      <span id="tt-underline"></span>
    </div>
  </div>
  <div class="top-right">
    <span id="clock"></span>
    <a href="#" id="contact-btn">联系</a>
  </div>
</header>

<!-- ═══ 首页大字(遮罩入场) ═══ -->
<div id="hero">
  <div class="hero-corner hero-left"></div>
  <div class="hero-line-wrap hero-mask"><div class="hero-line" id="hero-line-1"></div></div>
  <div class="hero-line-wrap hero-mask"><div class="hero-line" id="hero-line-2"></div></div>
  <div class="hero-corner hero-right"></div>
  <div id="hero-foot"></div>
</div>

<!-- ═══ 3D 画廊舞台 ═══ -->
<div id="stage"><div class="stage-error" id="stage-error" hidden></div></div>

<!-- 悬停大图标题 -->
<div id="hover-title-wrap"><div id="hover-title"></div></div>

<!-- 布局切换器(JS 动态填充) -->
<div id="switcher"></div>

<!-- 线稿模式开关 -->
<div id="frame-toggle" title="线稿模式">
  <span class="ft-icon ft-photo"></span>
  <span class="ft-icon ft-wire"></span>
</div>

<!-- 自定义光标 -->
<div id="cursor"></div>

<!-- ═══ 聚焦详情浮层 ═══ -->
<div id="focus-overlay"></div>
<aside id="focus-panel" aria-label="游戏详情">
  <div id="fp-inner">
    <div class="fp-head"><span>GAME DETAILS / 游戏详情</span><button id="fp-close" type="button" aria-label="关闭详情">关闭 ×</button></div>
    <img id="fp-img" alt="">
    <div id="fp-info">
      <h2 id="fp-title"></h2>
      <p id="fp-en"></p>
      <p id="fp-meta"></p>
      <div class="fp-section"><span class="fp-label">INTRODUCTION / 简介</span><p id="fp-desc"></p></div>
      <a id="fp-btn" href="#" target="_blank" rel="noopener noreferrer">查看官方页面 →</a>
    </div>
  </div>
</aside>

<!-- ═══ 幻彩模式背景层 ═══ -->
<div id="blob-layer"><canvas id="blob-canvas"></canvas></div>

<!-- ═══ 移动端卡片网格 ═══ -->
<div id="mobile-cards">
  <h1 id="mc-title"></h1>
  <div id="mc-grid"></div>
</div>

<!-- ═══ 本地预览提示 ═══ -->
<div id="file-tip" hidden></div>

<!-- 数据(先加载) → 站点逻辑 → 3D 引擎 -->
<script src="js/games-data.js"></script>
<script src="js/site.js"></script>
<script src="js/gallery.js"></script>
</body>
</html>
